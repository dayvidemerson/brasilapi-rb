name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.version.outputs.publish }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Verificar se a versão já tem tag
        id: version
        run: |
          version=$(sed -n 's/.*VERSION = "\([^"]*\)".*/\1/p' lib/brasil_api/version.rb)
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          if git rev-parse "refs/tags/v${version}" >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: check
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Run the default task
        run: bundle exec rake

      - name: Extrair notas do CHANGELOG
        id: changelog
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          ruby <<'RUBY' >> "$GITHUB_OUTPUT"
          version = ENV.fetch("VERSION")
          changelog = File.read("CHANGELOG.md")
          pattern = /^## \[#{Regexp.escape(version)}\][^\n]*\n(.*?)(?=^## |\z)/m
          match = changelog.match(pattern)
          abort("CHANGELOG sem a seção #{version}") unless match

          notes = match[1].strip
          abort("CHANGELOG da versão #{version} está vazio") if notes.empty?

          puts "notes<<NOTES_EOF"
          puts notes
          puts "NOTES_EOF"
          RUBY

      - name: Criar tag e GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
          NOTES: ${{ steps.changelog.outputs.notes }}
        run: |
          printf '%s\n' "$NOTES" > /tmp/release-notes.md
          gh release create "v${VERSION}" \
            --title "v${VERSION}" \
            --target "${GITHUB_SHA}" \
            --notes-file /tmp/release-notes.md

      - name: Publicar no RubyGems
        uses: rubygems/release-gem@v1
        with:
          attestations: true
